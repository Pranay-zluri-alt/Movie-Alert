name: booking-watch

on:
  schedule:
    # Every 15 min, 17-25 September only -- the window around the 24 Sep
    # release (premieres can open on the 23rd). Bounded on purpose:
    # ScraperAPI's free tier is 1,000 credits/month and continuous 10-min
    # polling would burn that in about two days. This window costs ~865.
    # Minutes are offset off :00 because GitHub drops scheduled runs at the
    # top of the hour under load. Runs are best-effort, so expect the odd
    # skipped tick -- that only costs a few minutes of latency.
    - cron: "3,18,33,48 * 17-25 9 *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

# Allow the workflow to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          # Notification channels. NTFY_TOPIC alone is enough (phone push,
          # no account needed); Telegram is optional and additive. The poller
          # exits non-zero if no channel is configured, or if every channel
          # fails to deliver, so state.json isn't advanced on a miss.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Route through an India egress so BookMyShow doesn't 403 the
          # US-based GitHub runner. Set SCRAPERAPI_KEY (or PROXY_URL) as a secret.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python poller.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update booking-watch state [skip ci]"
            git push
          else
            echo "No state change."
          fi
